<!-- index.html -->
<!-- Fichier HTML racine — c'est la seule page HTML du site (SPA = Single Page Application) -->
<!-- React va injecter tout le contenu dynamiquement dans la div id="root" -->

<!doctype html>
<html lang="fr"> 
    <!-- Langue française — important pour le SEO et l'accessibilité -->
    <head>
        <meta charset="UTF-8" /> 
        <!-- Encodage des caractères — support des accents français -->

        <link rel="icon" type="image/png" href="/logo.png" />
        <!-- Logo de Sens Solidaires — nom en minuscules comme le fichier public/logo.png (le serveur de production distingue majuscules et minuscules) -->

        <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0" />
        <!-- Indispensable pour le responsive mobile -->

        <title>Sens Solidaires</title>
        <!-- Titre par défaut — chaque page le remplace par le sien via le hook useSEO (src/hooks/useSEO.js, tâche 174) -->

        <meta name="description" content="Sens Solidaires, association de volontariat international : missions humanitaires et environnementales, actions éducatives et solidaires en France et à l'étranger." />
        <!-- Description affichée par Google sous le titre dans les résultats de recherche -->

        <!-- Aperçu par défaut quand un lien est partagé (Facebook, LinkedIn, WhatsApp…) — ces robots n'exécutent
             pas JavaScript : ils lisent ces valeurs. useSEO les remplace page par page pour Google et le navigateur. -->
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="Sens Solidaires" />
        <meta property="og:locale" content="fr_FR" />
        <meta property="og:title" content="Sens Solidaires — Volontariat et solidarité internationale" />
        <meta property="og:description" content="Sens Solidaires, association de volontariat international : missions humanitaires et environnementales, actions éducatives et solidaires en France et à l'étranger." />

        <!-- Chargement des polices Google Fonts — Lora (titres) + Source Sans 3 (corps de texte) -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">


    </head>

    <body>
        <!-- Point de montage de React — tout le site sera injecté ici par main.jsx -->
        <div id="root"></div>

        <!-- Vite charge main.jsx ici — type="module" permet d'utiliser les imports ES6 -->
        <script type="module" src="/src/main.jsx"></script>
    </body>

</html>
