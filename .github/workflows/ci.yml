# .github/workflows/ci.yml
# Intégration continue : lint, tests et build à chaque push sur dev-front, dev et main (donc aussi à chaque merge).

name: CI

on:
  push:
    branches: [dev-front, dev, main]
  # Pull requests vers dev / main : la CI vérifie le résultat AVANT le merge
  pull_request:
    branches: [dev, main]

# Deux pushs rapprochés sur la même branche : on annule le premier passage, seul le dernier compte
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# La CI lit le code, elle n'a besoin d'aucun autre droit sur le dépôt
permissions:
  contents: read

jobs:

  # ── Frontend : lint, tests Vitest, build ──────────────────────────────────
  frontend:
    name: Frontend (lint, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # Même version de Node que le Dockerfile ; le cache évite de tout retélécharger à chaque passage
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci : installe exactement les versions du package-lock.json
      - run: npm ci
      - run: npm run lint
      # Le dossier backend est présent dans la CI : le test de cohérence front/back tourne aussi
      - run: npm run test:run
      - run: npm run build

  # ── Backend : tests unitaires (sans base de données) ──────────────────────
  backend:
    name: Backend (tests unitaires)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run test:unit
